<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rosenbrock</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside>
    <header><span class="mark"></span><h1>Rosenbrock</h1></header>
    <p class="subtitle">A workspace for optimization.</p>
    <form id="parameters">
      <label>Method<select name="method" id="method"><option value="compare">Compare methods</option><option value="standard">Standard</option><option value="modified">Modified</option></select></label>
      <label>Objective function<select name="function"><option value="rosenbrock">Rosenbrock</option><option value="sphere">Sphere (test function)</option></select></label>
      <div class="pair"><label>Starting x<input name="x0" type="number" step="any" value="-1.2" required></label><label>Starting y<input name="y0" type="number" step="any" value="0" required></label></div>
      <div class="pair"><label title="Stopping threshold, not a guaranteed distance to the exact minimum.">Accuracy (ε)<input name="epsilon" type="number" step="any" min="1e-12" value="0.00001" required></label><label>Stop rule<select name="termination"><option value="step">Step size</option><option value="change">Changes</option></select></label></div>
      <p class="hint" id="accuracy-help"></p>
      <label id="line-settings">1D search method<select name="line_method"><option value="dsc_powell">DSC-Powell</option><option value="golden">Golden section</option></select></label>
      <label>Feasible region<select name="constraint" id="constraint"><option value="none">None</option><option value="disk">Inside circle</option><option value="halfplane">One side of a line</option><option value="box">Box (rectangle)</option></select></label>
      <div data-constraint="disk" hidden><div class="pair"><label>Center x<input name="center_x" type="number" step="any" value="0" required></label><label>Center y<input name="center_y" type="number" step="any" value="0" required></label></div><label>Circle radius<input name="radius" type="number" step="any" min="0.000001" value="1.3" required></label></div>
      <div data-constraint="halfplane" hidden><div class="pair"><label>Slope (m)<input name="slope" type="number" step="any" value="-0.5" required></label><label>Y-intercept (b)<input name="intercept" type="number" step="any" value="1" required></label></div><label>Allowed side<select name="side"><option value="below">Below: y ≤ mx + b</option><option value="above">Above: y ≥ mx + b</option></select></label></div>
      <div data-constraint="box" hidden><div class="pair"><label>Min x<input name="xmin" type="number" step="any" value="-2" required></label><label>Max x<input name="xmax" type="number" step="any" value="2" required></label></div><div class="pair"><label>Min y<input name="ymin" type="number" step="any" value="-2" required></label><label>Max y<input name="ymax" type="number" step="any" value="2" required></label></div></div>
      <details><summary>More parameters</summary>
        <div class="pair standard-options"><label>Initial x step<input name="step1" type="number" step="any" value="0.3" required></label><label>Initial y step<input name="step2" type="number" step="any" value="1.2" required></label></div>
        <div class="pair standard-options"><label title="Multiply a successful step by this factor (> 1).">Step growth (α)<input name="alpha" type="number" step="any" value="3" required></label><label title="Reverse and shrink a failed step with this factor (−1 < β < 0).">Step reversal (β)<input name="beta" type="number" step="any" value="-0.5" required></label></div>
        <div class="pair modified-options"><label title="Initial spacing used by Sven to bracket the 1D minimum.">Bracketing step<input name="delta" type="number" step="any" value="0.1" required></label><label title="Stopping threshold for the 1D search. Default: accuracy / 10; must not exceed accuracy.">1D accuracy<input name="line_epsilon" type="number" step="any" placeholder="ε / 10"></label></div>
        <label>Max iterations<input name="max_iterations" type="number" step="1" min="1" max="50000" value="10000" required></label>
        <label class="modified-options">Max 1D iterations<input name="line_max_iterations" type="number" step="1" min="1" max="50000" value="1000" required></label>
      </details>
      <div class="actions"><button id="run" type="submit">Run comparison</button><label class="checkbox"><input id="show-plot" type="checkbox" checked>Show plot</label></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" aria-live="polite"></section>
  </aside>
  <main>
    <div class="plot-header"><div><h2>Search trajectory</h2><p id="plot-description">Contours and accepted steps</p></div><div id="legend"></div></div>
    <div id="plot-area"><canvas id="plot" aria-label="Function contours and optimization trajectories"></canvas><div id="placeholder" hidden>Plot hidden</div></div>
    <footer><span id="plot-note">Start &bull; End &nbsp; / &nbsp; Shaded area is infeasible</span><span id="run-note">Ready</span></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
